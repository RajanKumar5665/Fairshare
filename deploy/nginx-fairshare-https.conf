# Live Nginx site for FairShare with HTTPS (installed at /etc/nginx/sites-available/fairshare).
# Main address: https://splitcircle.duckdns.org — every other address redirects there.
# Certificates come from Let's Encrypt (certbot) and renew automatically.

# ── Plain http (any name or the bare IP) → https main address ──────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name splitcircle.duckdns.org 15-134-37-177.sslip.io _;

    # Let's Encrypt renewal checks
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://splitcircle.duckdns.org$request_uri;
    }
}

# ── Old https name → main address ──────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 15-134-37-177.sslip.io;

    ssl_certificate /etc/letsencrypt/live/15-134-37-177.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/15-134-37-177.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://splitcircle.duckdns.org$request_uri;
}

# ── Main site ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name splitcircle.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/splitcircle.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/splitcircle.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Visits by IP or another name over https → main address
    if ($host != "splitcircle.duckdns.org") {
        return 301 https://splitcircle.duckdns.org$request_uri;
    }

    root /var/www/fairshare/current/frontend-dist;
    index index.html;

    client_max_body_size 5m;   # receipt photos are up to ~2 MB as base64

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # API → Node
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live updates (socket.io)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA: the service worker and manifest must never be cached, or updates won't arrive
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Built JS/CSS have hashed names → cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path (/rooms/123, /join?token=…) loads index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
