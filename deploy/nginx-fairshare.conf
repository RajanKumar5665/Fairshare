# Nginx site for FairShare: serves the built app and sends /api to Node (PM2, port 4000).
# setup-server.sh replaces __SERVER_NAME__ with your domain (or "_" when you only have an IP).
# After `certbot --nginx`, certbot adds the HTTPS (443) block to this file by itself.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/fairshare/current/frontend-dist;
    index index.html;

    client_max_body_size 5m;   # receipt photos are up to ~2 MB as base64

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # API → Node
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live updates (socket.io)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # PWA: the service worker and manifest must never be cached, or updates won't arrive
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Built JS/CSS have hashed names → cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path (/rooms/123, /join?token=…) loads index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
